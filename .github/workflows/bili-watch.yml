name: Bili UP Watch

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a WxPusher test message only"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python watch.py
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
