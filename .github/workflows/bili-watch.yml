name: Bili UP Watch

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a WxPusher test message only"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      sync_only:
        description: "Update seen.json without sending notifications"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python watch.py
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
          TEST_PUSH: ${{ github.event.inputs.test_push }}
          SYNC_ONLY: ${{ github.event.inputs.sync_only }}

      - name: Commit state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -f seen.json ]; then
            git add seen.json
            git diff --cached --quiet || git commit -m "Update seen videos"
            git push
          else
            echo "seen.json not found, skip commit"
          fi
